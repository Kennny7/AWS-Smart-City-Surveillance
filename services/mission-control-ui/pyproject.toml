[project]
name = "mission-control-ui"
version = "0.1.0"
description = "Chronos Mission Control - Cyber-Tactical Surveillance HUD & 3D Intelligence Dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.39.0",
    "opencv-python-headless>=4.10.0.84",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "pillow>=10.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
ui = "app:start"
