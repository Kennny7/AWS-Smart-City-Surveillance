[project]
name = "anomaly-detector"
version = "0.1.0"
description = "Chronos Anomaly Detector - Real-time Spatial-Temporal Threat & Anomaly Detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
 "torch>=2.2.0",
 "torchvision>=0.17.0",
 "opencv-python-headless>=4.10.0.84",
 "numpy>=1.26.0",
 "fastapi>=0.115.0",
 "uvicorn[standard]>=0.32.0",
 "pydantic>=2.9.0",
 "python-dotenv>=1.0.1",
 "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
anomaly = "main:start"
