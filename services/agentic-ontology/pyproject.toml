[project]
name = "agentic-ontology"
version = "0.1.0"
description = "Chronos Agentic Threat Ontology - Multi-Agent Threat Reasoning & Knowledge Graph Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
 "openai>=1.50.0",
 "networkx>=3.2.1",
 "fastapi>=0.115.0",
 "uvicorn[standard]>=0.32.0",
 "pydantic>=2.9.0",
 "python-dotenv>=1.0.1",
 "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
agentic = "main:start"
